# Linux (depuis le code source, dans le navigateur) : les mêmes tests que sur Mac et Windows, puis le script
# ./arxivreader lui-même (environnement Python, serveur, import d'un article), à chaque poussée sur main.
name: Linux

on:
  push:
    branches: [main, linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Tests
        run: python -m unittest discover -s tests

      # Comme un utilisateur Linux : ./arxivreader crée .venv, démarre le serveur et dit où ouvrir le navigateur
      - name: Launcher script
        run: |
          ./arxivreader > launcher.log 2>&1 &
          for i in $(seq 1 180); do curl -s -o /dev/null http://127.0.0.1:8710/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8710/ || { cat launcher.log; exit 1; }
          type=$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8710/static/js/app.js)
          echo "app.js: $type"; case "$type" in text/javascript*) ;; *) exit 1 ;; esac
          curl -sf -X PUT -H 'Content-Type: application/json' -d '{"onboarded": true}' http://127.0.0.1:8710/api/settings > /dev/null
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"query": "1603.04246"}' http://127.0.0.1:8710/api/papers > /dev/null
          for i in $(seq 1 120); do curl -s http://127.0.0.1:8710/api/papers/1603.04246/importing | grep -q false && break; sleep 1; done
          title=$(curl -s http://127.0.0.1:8710/api/papers/1603.04246 | python -c "import json,sys; print(json.load(sys.stdin)['paper']['title'])")
          echo "imported: $title"; [ -n "$title" ]
          ./arxivreader 2>&1 | head -3   # second lancement : « arXivReader tourne déjà »
          cat launcher.log
