# Version Windows : construite et essayée sur une machine Windows de GitHub à chaque poussée sur main (tests, serveur,
# import d'un article, fenêtre de l'application, captures d'écran). Pour une étiquette vX.Y.Z (macos/release.sh, même
# numéro que app/version.py), le zip est joint à la version GitHub vX.Y.Z, à côté du .dmg du Mac.
name: Windows

on:
  push:
    branches: [main, windows]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # étiquette vX.Y.Z : le code doit porter le même numéro (sinon l'application annoncerait une autre version)
      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          if (-not (Select-String -Path app/version.py -SimpleMatch -Pattern "VERSION = `"$version`"" -Quiet)) {
              throw "tag $env:TAG does not match app/version.py"
          }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r windows/build-requirements.txt

      # Les mêmes essais que sur le Mac (ceux propres au Mac sont sautés)
      - name: Tests
        run: python -m unittest discover -s tests

      # Serveur (Python, PyInstaller) : server\arXivReader-server.exe, lancé sans fenêtre par l'application
      - name: Build server
        run: >
          pyinstaller windows/launcher.py --name arXivReader-server --noconsole --onedir --noconfirm
          --icon windows/arXivReader.ico --paths . --add-data "static;static"
          --collect-submodules app --collect-submodules uvicorn --collect-all claude_agent_sdk
          --collect-data tzdata --collect-data certifi

      # Fenêtre de l'application (C#, WebView2) : arXivReader.exe
      - name: Build window
        shell: pwsh
        run: |
          dotnet build windows/shell/arXivReader.csproj -c Release -o dist/arXivReader
          Remove-Item dist/arXivReader/Microsoft.Web.WebView2.Wpf.* -ErrorAction SilentlyContinue  # pas de WPF ici
          Move-Item dist/arXivReader-server dist/arXivReader/server

      - name: Package
        shell: pwsh
        run: |
          Copy-Item windows/LISEZMOI.txt dist/arXivReader/
          Get-ChildItem dist/arXivReader -Name
          Compress-Archive -Path dist/arXivReader -DestinationPath arXivReader-windows.zip
          "{0:N0} Mo" -f ((Get-Item arXivReader-windows.zip).Length / 1MB)

      - name: Smoke test
        shell: pwsh
        run: windows/smoke.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arXivReader-windows
          retention-days: 14
          path: |
            arXivReader-windows.zip
            shots/
            smoke-library/server.log

  # Publication, à part : seule cette étape a le droit d'écrire sur le dépôt. La version vX.Y.Z est créée par
  # macos/release.sh avec le .dmg ; le zip Windows y est joint (remplacé si l'étape est relancée).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arXivReader-windows

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # la version GitHub est créée juste après l'étiquette (construction du .dmg) : attendue au plus 30 min
          for i in $(seq 1 60); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 30; done
          gh release upload "$TAG" arXivReader-windows.zip --clobber
